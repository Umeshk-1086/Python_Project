{% extends "base.html" %}

{% block title %}Post a Need — Maanglo{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card" style="max-width: 560px;">

        <h1 class="auth-title">Post a Need</h1>
        <p class="auth-sub">Tell sellers exactly what you're looking for.</p>

        <form method="POST" action="/post-need">

            <div class="form-group">
                <label class="form-label" for="title">What do you need?</label>
                <input class="form-input" type="text" id="title" name="title"
                    placeholder="e.g. iPhone 14 Pro 256GB" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="description">Describe your requirement</label>
                <textarea class="form-input form-textarea" id="description" name="description"
                    placeholder="Add details like condition, colour, warranty, delivery preference..."
                    required></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="category">Category</label>
                <select class="form-input form-select" id="category" name="category" required>
                    <option value="" disabled selected>Select a category</option>
                    <option value="Electronics">📱 Electronics</option>
                    <option value="Clothing">👕 Clothing</option>
                    <option value="Home & Furniture">🏠 Home & Furniture</option>
                    <option value="Books & Education">📚 Books & Education</option>
                    <option value="Sports & Outdoor">🚲 Sports & Outdoor</option>
                    <option value="Gaming">🎮 Gaming</option>
                    <option value="Tools & Hardware">🔧 Tools & Hardware</option>
                    <option value="Kitchen & Appliances">🍳 Kitchen & Appliances</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="budget">Your budget (₹)</label>
                <input class="form-input" type="number" id="budget" name="budget"
                    placeholder="e.g. 50000" min="1" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="location">Your location</label>
                <input class="form-input" type="text" id="location" name="location"
                    placeholder="e.g. Vadodara, Gujarat" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg form-btn">
                Post My Need →
            </button>

        </form>

        <p class="form-footer">
            Changed your mind? <a href="/dashboard">Back to dashboard</a>
        </p>

    </div>
</div>
{% endblock %}
